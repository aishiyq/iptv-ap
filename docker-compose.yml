services:
  iptv-api:
    image: aishiyq/iptv-ap:latest
    container_name: iptv-ap
    restart: unless-stopped

    ports:
      - "80:8080" #如80端口占用可修改80端口为未被占用端口

    volumes:
      - /iptv-api/config:/iptv-api/config #修改 - /iptv-api/config：为飞牛实际路径
      - /iptv-api/output:/iptv-api/output #修改 - /iptv-api/output:为飞牛实际路径

    environment:
      PUBLIC_SCHEME: "http"
      # Replace with your public domain or IP
      PUBLIC_DOMAIN: "127.0.0.1" #修改为本地IP地址
      PUBLIC_PORT: "80"
      NGINX_HTTP_PORT: "8080"
      CDN_URL: ""
      HTTP_PROXY: ""
